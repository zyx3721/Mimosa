conky.text = [[
${execi 600 ~/.conky/Mimosa/scripts/weather-v4.0.sh -g}\
${image ~/.conky/Mimosa/assets/bg.png -s 300x461 -p 0,135}
# 时间/日期模块
${offset 0}${voffset 0}${font Inter:size=45}${time %H:%M}${font}
${offset 0}${voffset 3}${font Noto Sans CJK SC:size=14}${time %Y.%m.%d %A}
# 天气模块
${offset 14}${voffset 40}${font feather:size=25}${execi 15 ~/.conky/Mimosa/scripts/weather-v4.0.sh -i}${goto 73}${font Bebas Neue:size=22}${execi 100 ~/.conky/Mimosa/scripts/weather-v4.0.sh -t}°C${font}
${offset 14}${voffset 4}${color1}${font Noto Sans CJK SC:bold:size=14}南宁${font}
${offset 14}${voffset 0}${color}${font Noto Sans CJK SC:size=12}${execi 100 ~/.conky/Mimosa/scripts/weather-v4.0.sh -d}${font}
${offset 14}${voffset 0}${color}${font Noto Sans CJK SC:size=8}风速 : ${execi 100 ~/.conky/Mimosa/scripts/weather-v4.0.sh -ws}m/s
${offset 14}${voffset 0}${color}${font Noto Sans CJK SC:size=8}湿度 : ${execi 100 ~/.conky/Mimosa/scripts/weather-v4.0.sh -h}%
# 网络模块（自动切换有线/无线网卡）
${offset 172}${voffset -130}${font Noto Sans CJK SC:size=8}${if_existing /sys/class/net/enp4s0/carrier 1}NetWork: 有线连接${else}${execi 5 echo "NetWork: $(~/.conky/Mimosa/scripts/ssid | cut -c 1-15)"}${endif}
${offset 172}${voffset 2}${font Abel:size=8}${if_existing /sys/class/net/enp4s0/carrier 1}Dn : ${downspeed enp4s0}${alignr 16}>>   ${totaldown enp4s0}${else}Dn : ${downspeed wlp0s20f3}${alignr 16}>>   ${totaldown wlp0s20f3}${endif}
${offset 172}${voffset 0}${color}${if_existing /sys/class/net/enp4s0/carrier 1}${downspeedgraph enp4s0 24,110 FF4539 FF4539}${else}${downspeedgraph wlp0s20f3 24,110 FF4539 FF4539}${endif}
${offset 172}${voffset -3}${color}${font Abel:size=8}${if_existing /sys/class/net/enp4s0/carrier 1}Up : ${upspeed enp4s0}${alignr 16}>>   ${totalup enp4s0}${else}Up : ${upspeed wlp0s20f3}${alignr 16}>>   ${totalup wlp0s20f3}${endif}
# 系统状态模块
${offset 172}${voffset 0}${color B54036}${if_existing /sys/class/net/enp4s0/carrier 1}${upspeedgraph enp4s0 24,110 32d74c 32d74c}${else}${upspeedgraph wlp0s20f3 24,110 32d74c 32d74c}${endif}
${offset 27}${voffset 106}${color}${font Bebas Neue:size=18}${cpu cpu0}%${goto 104}${memperc}%${goto 170}${battery_percent BAT0}%${goto 240}${hwmon 9 temp 1}°C
# Storage 模块
${offset 14}${voffset 32}${color}${font Abel:bold:size=14}Storage${font}
${color}${offset 172}${voffset -20}${font Feather:size=22}
# 媒体播放模块
${color}${offset 172}${voffset 0}${font Abel:size=9}${execi 1 playerctl status} 
${color2}${offset 172}${voffset 0}${font Abel:bold:size=10}${execi 1 ~/.conky/Mimosa/scripts/playerctl-info.sh -a}${font}
${color}${offset 172}${voffset 0}${font Abel:italic:size=9}${execi 1 playerctl metadata xesam:title | cut -c 1-25}${font}
${color}${offset 172}${voffset 0}${font Abel:size=8}${execi 1 playerctl position --format "{{ duration(position) }}"}${font}
]]
